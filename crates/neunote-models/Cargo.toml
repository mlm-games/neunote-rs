[package]
name = "neunote-models"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neunote-types = { path = "../neunote-types" }
hex = "0.4"
serde = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

# Downloading is native-only. wasm has no filesystem to keep a resumable .part
# file in and no sockets for reqwest; there the host hands over the weights
# instead, so only the pins and the digest check are needed.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-util = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"