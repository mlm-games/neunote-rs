[package]
name = "neunote-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The terminal binary. A wasm host embeds `neunote-pipeline` instead: no argv,
# no filesystem, and a browser already has its own way to read a file and show
# a MIDI blob.
[[bin]]
name = "neunote"
path = "src/main.rs"

[dependencies]
neunote-pipeline = { path = "../neunote-pipeline" }
neunote-types = { path = "../neunote-types" }
neunote-audio = { path = "../neunote-audio" }
neunote-midi = { path = "../neunote-midi" }

clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
    "fs",
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
] }
neunote-models = { path = "../neunote-models" }
