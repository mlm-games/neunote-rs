[package]
name = "neunote-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "neunote_gui"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "neunote-gui"
path = "src/main.rs"

[dependencies]
neunote-ui = { path = "../../crates/neunote-ui" }
neunote-types = { path = "../../crates/neunote-types" }
# Only its manifest reaches the web build; the cache and downloader are the
# native-only halves.
neunote-models = { path = "../../crates/neunote-models" }
repose-platform = "0.31"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
clipawl = { version = "0.4", features = ["async-io", "linux-wayland", "linux-x11"] }
cpal = "0.18"
env_logger = "0.11"
log = "0.4"
rlobkit-dialogs = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
cpal = "0.18"
futures-lite = "2"
game-utils = "0.4"
log = "0.4"
repose-core = "0.31"
rlobkit-app-events = "0.6"
rlobkit-dialogs = "0.6"
winit = { version = "0.30", features = ["android-native-activity"] }

[package.metadata.android]
package = "org.mlm.neunote"
apk_name = "neunote"
build_targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "i686-linux-android",
]
split_per_abi = true
resources = "others/packaging/res"

[package.metadata.android.application]
label = "Neunote"
fullscreen = false
icon = "@drawable/ic_launcher_monochrome"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true
launch_mode = "singleTask"
config_changes = "orientation|keyboardHidden|screenSize|uiMode"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "content"
mime_type = "audio/*"

[[package.metadata.android.application.activity.intent_filter.data]]
scheme = "file"
mime_type = "audio/*"

[target.'cfg(target_arch = "wasm32")'.dependencies]
hex = "0.4"
js-sys = "0.3"
sha2 = "0.10"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "File",
    "FileList",
    "FileSystemDirectoryHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemWritableFileStream",
    "HtmlElement",
    "HtmlInputElement",
    "Navigator",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "StorageManager",
    "Url",
] }
