[workspace]
resolver = "2"
members = [
  "crates/neunote-types",
  "crates/neunote-tokenizer",
  "crates/neunote-audio",
  "crates/neunote-midi",
  "crates/neunote-engine",
  "crates/neunote-models",
  "crates/neunote-pipeline",
  "crates/neunote-ui",
  "apps/neunote-gui",
  "crates/neunote-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

