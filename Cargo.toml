[workspace]
resolver = "2"
members = ["crates/neunote-types", "crates/neunote-tokenizer", "crates/neunote-core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
