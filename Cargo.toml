[package]
name = "neuralnote-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
rayon = "1"
thiserror = "2"
log = "0.4"

tract-onnx = "0.23"

[dev-dependencies]
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
