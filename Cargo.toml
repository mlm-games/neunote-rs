[package]
name = "neunote-core"
version = "0.1.1"
license = "GPL-3.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
tract-onnx = "0.23"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
